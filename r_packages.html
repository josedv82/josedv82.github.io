<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R Packages — Jose Fernandez</title>
  <script src="static/js/theme.js"></script>
  <link rel="stylesheet" href="static/css/style.css">
  <style>
    .pkg-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1.2rem;
      margin-top: 1rem;
    }

    .pkg-card {
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1.2rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.5rem;
      transition: border-color 0.15s;
    }

    .pkg-card:hover {
      border-color: var(--text-muted);
    }

    .pkg-card img {
      width: 48px;
      height: auto;
      filter: grayscale(100%);
    }

    .pkg-name {
      font-family: 'Courier New', monospace;
      font-size: 0.95rem;
      font-weight: bold;
    }

    .pkg-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
    }
  </style>
</head>
<body>

  <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme">dark</button>
  <a href="index.html" class="site-title">Jose Fernandez</a>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <a href="index.html">Jose Fernandez</a>
    <span class="sep">/</span>
    <span>R Packages</span>
  </nav>

  <main style="padding-top: 2.5rem;">
    <h3>R Packages</h3>
    <div class="pkg-grid">

      <a href="https://github.com/josedv82/matuR" class="pkg-card" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/josedv82/matuR/refs/heads/master/man/images/maturlogo.png" alt="matuR">
        <div class="pkg-name">matuR</div>
        <p class="pkg-desc">Calculate and plot athlete maturation and biobanding metrics.</p>
      </a>

      <a href="https://github.com/josedv82/airball" class="pkg-card" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/josedv82/airball/refs/heads/master/man/images/airballlogo.PNG" alt="airball">
        <div class="pkg-name">airball</div>
        <p class="pkg-desc">Schedule density, travel metrics, and injury transactions for NBA teams since 1947.</p>
      </a>

      <a href="https://github.com/josedv82/bdgramR" class="pkg-card" target="_blank" rel="noopener">
        <img src="https://raw.githubusercontent.com/josedv82/bdgramR/refs/heads/master/man/images/bodygramRlogo.png" alt="bdgramR">
        <div class="pkg-name">bdgramR</div>
        <p class="pkg-desc">Human body diagram visualizations and ggplot2 extensions in R.</p>
      </a>

    </div>

    <a href="index.html" class="back-link">← Back</a>
  </main>

</body>
</html>
